aid: cameo
name: Cameo
description: 'Cameo is a consumer marketplace for personalized video messages from celebrities,
  athletes, musicians, comedians, and creators. Fans book a custom shout-out by sending a
  short script with personal details, and the talent records and delivers a bespoke video,
  typically within seven days, for occasions like birthdays, milestones, and celebrations.
  Cameo also runs Cameo for Business for branded talent content, sells gift cards, and offers
  a Red Carpet Rewards loyalty program. Cameo does not publish a public developer API or
  OpenAPI; this profile tracks the company''s public web, help, and security surface.'
